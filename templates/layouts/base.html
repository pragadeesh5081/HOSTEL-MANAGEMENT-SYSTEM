<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Hostel Management System{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Modern Hostel Management System for college students and administrators.{% endblock %}"/>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- HMS Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Flash messages as data attributes for JS toast conversion -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div data-flash="{{ message }}" data-flash-type="{{ category }}" style="display:none"></div>
  {% endfor %}
{% endwith %}

{% block body %}{% endblock %}

<!-- Toast container -->
<div class="hms-toast-container" id="hmsToastContainer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<!-- HMS JS -->
<script src="{{ url_for('static', filename='js/hms.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
